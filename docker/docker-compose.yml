version: "3.9"

services:
  machine-vision:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: machine-vision
    environment:
      RESTAPI_URL: http://localhost:8000
      FRIGATE_URL: http://frigate:5000
      LOITER_THRESHOLD_SECONDS: 30
      TAILGATE_WINDOW_SECONDS: 3
      COMPREFACE_URL: http://compreface:8000
      COMPREFACE_API_KEY: demo-key
      COMPREFACE_MIN_SIMILARITY: 0.80
    volumes:
      - ..:/app
    command: python src/main.py --rest
